<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category – ASK INVESTMENT</title>
<meta name="description" content="Products in this category.">
<link rel="icon" href="company%20logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Newsreader:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="wrap bar">
    <a href="index.html" class="brand" aria-label="ASK INVESTMENT home">
      <span class="logo"><img src="company%20logo.jpg" alt=""></span>
      <b>ASK INVESTMENT</b>
    </a>
    <nav class="nav-r" aria-label="Main">
      <a href="index.html#about">About Us</a>
      <a href="products.html">Products</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="block products">
    <div class="wrap">
      <a class="crumb" href="products.html">Back to all categories</a>
      <h2 id="title">Category</h2>
      <p class="sub" id="sub"></p>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>&copy; <span id="yr"></span> ASK INVESTMENT</span>
  </div>
</footer>

<script src="data.js"></script>
<script>
const q=new URLSearchParams(location.search);
const cat=CATEGORIES.find(x=>x.id===q.get('c'));
const grid=document.getElementById('grid'), tabs=document.getElementById('tabs');
function show(items){
  grid.replaceChildren();
  if(!items.length){const m=document.createElement('p'); m.className='sub'; m.textContent='Products coming soon.'; grid.append(m); return;}
  items.forEach(p=>{
    const c=document.createElement('article'); c.className='card';
    if(p.image){const i=document.createElement('img'); i.className='pimg'; i.src=encodeURI(p.image); i.alt=p.name; c.append(i);}
    if(p.brand){const s=document.createElement('small'); s.textContent=p.brand; c.append(s);}
    const h=document.createElement('h3'); h.textContent=p.name; c.append(h);
    const t=document.createElement('p'); t.textContent=p.text; c.append(t);
    if(p.price){const r=document.createElement('p'); r.className='price'; r.textContent=p.price; c.append(r);}
    const a=document.createElement('a'); a.href='contact.html'; a.textContent='Ask about this product'; c.append(a);
    grid.appendChild(c);
  });
}
if(!cat){
  tabs.remove();
  document.getElementById('title').textContent='Category not found';
  document.getElementById('sub').textContent='Go back to all categories and choose one.';
}else{
  document.title=(cat.title||cat.name)+' – ASK INVESTMENT';
  document.getElementById('title').textContent=cat.title||cat.name;
  document.getElementById('sub').textContent=cat.text;
  if(cat.sections&&cat.sections.length){
    const pick=s=>{
      [...tabs.children].forEach(b=>b.setAttribute('aria-selected',String(b.dataset.id===s.id)));
      show(s.products);
      history.replaceState(null,'','?c='+encodeURIComponent(cat.id)+'&s='+encodeURIComponent(s.id));
    };
    cat.sections.forEach(s=>{
      const b=document.createElement('button'); b.type='button'; b.setAttribute('role','tab'); b.dataset.id=s.id; b.textContent=s.name;
      b.addEventListener('click',()=>pick(s)); tabs.append(b);
    });
    pick(cat.sections.find(x=>x.id===q.get('s'))||cat.sections[0]);
  }else{
    tabs.remove();
    show(cat.products||[]);
  }
}
document.getElementById('yr').textContent=new Date().getFullYear();
</script>
</body>
</html>
